name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Exercises the validation harness's own parsing and checking logic
      # against synthetic transcripts. Live council runs need the Claude
      # Code CLI and an account, so they are not run here.
      - name: validate.py --self-test
        run: python examples/validate.py --self-test
