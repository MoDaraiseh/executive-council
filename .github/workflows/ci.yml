name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Pinned to full commit SHAs, not mutable tags; Dependabot
      # (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.6"
      - name: ruff
        run: ruff check .
      # Offline only: parsing, checks (a)-(e), the jurisdiction-gate hook run as
      # a real subprocess, and workspace isolation. Live council runs need the
      # claude CLI and real model usage, so they are not part of CI.
      - name: harness self-test
        run: python examples/validate.py --self-test
